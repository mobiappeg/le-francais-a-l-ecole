<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le français à l’école – Alhossam Integrated Schools</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8ff;--card:#fff;--ink:#17315c;--mut:#5d6f8f;--c:#1e88e5;--tint:#e3f1fd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;padding-bottom:40px}
header{background:linear-gradient(160deg,#1565c0,#1e88e5 55%,#00acc1);color:#fff;text-align:center;padding:28px 16px 64px;border-radius:0 0 40px 40px}
header h1{font:800 clamp(2rem,6vw,3.2rem)/1.1 "Baloo 2",sans-serif;margin:6px 0;direction:ltr}
header p{margin:4px 0;opacity:.95}
.pill{display:inline-block;background:#fdd24f;color:#17315c;font:800 1rem "Baloo 2";padding:6px 18px;border-radius:30px;direction:ltr}
.bar{max-width:900px;margin:-40px auto 0;padding:0 12px}
.ctl{background:#fff;border-radius:20px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;box-shadow:0 6px 20px #17315c22}
.ctl label{font-size:.9rem;color:var(--mut)}
select,button{font-family:inherit}
select{padding:6px 10px;border-radius:12px;border:2px solid #cfe0f5;max-width:220px;direction:ltr}
.tg{display:flex;border:2px solid #cfe0f5;border-radius:14px;overflow:hidden}
.tg button{border:0;background:#fff;padding:6px 14px;font-weight:700;cursor:pointer}
.tg button.on{background:var(--ink);color:#fff}
nav{display:flex;gap:8px;overflow-x:auto;padding:14px 12px;max-width:900px;margin:0 auto;scrollbar-width:thin}
nav button{flex:none;border:2px solid var(--c);background:#fff;color:var(--ink);border-radius:30px;padding:6px 14px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
nav button.on{background:var(--c);color:#fff}
main{max-width:900px;margin:0 auto;padding:0 12px}
.sh{background:var(--c);color:#fff;border-radius:24px;padding:16px 20px;display:flex;align-items:center;gap:14px;margin-bottom:12px}
.sh .e{font-size:2.2rem;background:#fff;border-radius:50%;width:62px;height:62px;display:grid;place-items:center}
.sh h2{margin:0;font:800 1.6rem "Baloo 2";direction:ltr}
.sh small{display:block;font-size:1.05rem}
.sh .all{margin-inline-start:auto;border:0;background:#fff;color:var(--ink);font-weight:800;padding:8px 14px;border-radius:20px;cursor:pointer}
.grid{display:grid;gap:10px}
.card{background:var(--card);border:2px solid var(--c);border-radius:20px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer;text-align:start;width:100%;font-family:inherit;color:inherit;transition:transform .15s,background .15s}
.card:hover{background:var(--tint)}
.card:focus-visible,nav button:focus-visible,.tg button:focus-visible{outline:3px solid #fdd24f;outline-offset:2px}
.card.play{background:var(--tint);transform:scale(1.02)}
.card .em{font-size:1.9rem;background:var(--tint);border-radius:14px;width:54px;height:54px;display:grid;place-items:center}
.fr{font:800 1.3rem/1.25 "Baloo 2",sans-serif;direction:ltr;text-align:left;display:block}
.ar{font-weight:700;display:block;margin-top:2px}
.tr{color:var(--mut);font-size:.92rem;display:block}
.spk{font-size:1.4rem;background:var(--c);color:#fff;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}
.card.play .spk{animation:p .8s infinite alternate}
@keyframes p{to{transform:scale(1.18)}}
.ch{background:#e0f5f1;border:2px dashed #00897b;border-radius:24px;padding:16px;margin-top:14px;text-align:center}
.days{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.days label{background:#fff;border-radius:14px;padding:10px 14px;font-size:.9rem;cursor:pointer;display:grid;gap:6px;place-items:center}
.days input{width:26px;height:26px;accent-color:#00897b}
.ch textarea{width:100%;min-height:110px;margin-top:10px;border:2px solid #00897b;border-radius:16px;padding:10px;font:inherit;direction:ltr}
.note{text-align:center;color:var(--mut);font-size:.85rem;margin:18px 12px}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a2e;--card:#16253f;--ink:#e8f0ff;--mut:#9fb2d3;--tint:#1f3358}.ctl,.tg button,nav button,.days label,select{background:#16253f;color:var(--ink)}.tg button.on{background:#fdd24f;color:#17315c}.ch{background:#12302e}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.logos{display:inline-block;max-width:min(92%,640px);background:#f7f7f7;border:4px solid #fdd24f;border-radius:26px;padding:8px 14px;box-shadow:0 8px 0 #0d47a155,0 14px 26px #0d47a166;margin-bottom:8px}
.logos img{display:block;width:100%;height:auto;border-radius:14px}
.by{display:inline-flex;flex-direction:column;gap:2px;margin-top:12px;padding:10px 26px;border-radius:22px;background:#ffffff26;border:2px solid #ffffff80;backdrop-filter:blur(4px)}
.by b{font-weight:700;font-size:1.15rem}
.by span{font:800 1.1rem "Baloo 2",sans-serif;direction:ltr;color:#fdd24f}
</style>
</head>

const $=id=>document.getElementById(id),nav=$("nav"),m=$("m");
let cur=0,slow=false,voice=null,q=0;
const days=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس"];
const clean=t=>t.replace(/\((e|t)\)/g,"").replace(/…/g,"").replace(/’/g,"'");
function voices(){
  if(!("speechSynthesis" in window)){$("note").textContent="⚠️ المتصفح ده مش بيدعم النطق الصوتي. جرّب Chrome أو Safari أو Edge.";return}
  const fr=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));
  const sc=v=>(/fr[-_]FR/i.test(v.lang)?10:0)+(/neural|natural|online|google|premium|enhanced/i.test(v.name)?20:0)+(/thomas|amélie|amelie|audrey|denise|henri|eloise|vivienne/i.test(v.name)?5:0);
  fr.sort((a,b)=>sc(b)-sc(a));
  const sel=$("vs");sel.innerHTML="";
  fr.forEach((v,i)=>sel.add(new Option(v.name+" ("+v.lang+")",i)));
  voice=fr[0]||null;sel.onchange=()=>voice=fr[sel.value];
  $("note").textContent=fr.length?"💡 الصوت بيتولّد من جهازك. لو عايز أحسن جودة اختار صوت Neural / Google / Premium من القائمة فوق.":"⚠️ مفيش صوت فرنسي مثبّت على جهازك. ضيف لغة Français من إعدادات النظام (Text-to-speech) وارجع افتح الصفحة.";
}
if("speechSynthesis" in window){speechSynthesis.onvoiceschanged=voices;voices()}
function say(t,done){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(clean(t));
  u.lang="fr-FR";if(voice)u.voice=voice;u.rate=slow?.55:.92;
  u.onend=u.onerror=()=>done&&done();
  speechSynthesis.speak(u);
}
function playAll(i=0,list=S[cur][4]){
  const cards=[...m.querySelectorAll(".card")],t=++q;
  const go=k=>{cards.forEach(c=>c.classList.remove("play"));if(k>=list.length||t!==q)return;
    cards[k].classList.add("play");cards[k].scrollIntoView({block:"center",behavior:"smooth"});
    say(list[k][1],()=>setTimeout(()=>go(k+1),500))};
  go(i);
}
function render(){
  const [e,fr,ar,c,items]=S[cur];q++;speechSynthesis&&speechSynthesis.cancel();
  document.documentElement.style.setProperty("--c",c);
  [...nav.children].forEach((b,i)=>b.classList.toggle("on",i==cur));
  m.innerHTML=`<div class="sh"><div class="e">${e}</div><div><h2>${fr}</h2><small>${ar}</small></div><button class="all" id="pa">▶ اسمع الكل</button></div><div class="grid">`+
  items.map((x,i)=>`<button class="card" data-i="${i}"><span class="em">${x[0]}</span><span><span class="fr">${x[1]}</span><span class="ar">${x[2]}</span><span class="tr">${x[3]}</span></span><span class="spk">🔊</span></button>`).join("")+`</div>`+
  (cur==S.length-1?`<div class="ch"><h3 style="margin:0;font-family:'Baloo 2'">🏆 Mon défi de la semaine</h3><p>كل يوم قول 3 جمل بالفرنسي وعلّم ✔️</p><div class="days">${days.map((d,i)=>`<label>${d}<input type="checkbox" data-d="${i}"></label>`).join("")}</div><h3 style="font-family:'Baloo 2';margin-bottom:0">✍️ Mes nouvelles phrases</h3><textarea id="np" placeholder="اكتب هنا أي جملة فرنسية جديدة اتعلمتها"></textarea></div>`:"");
  m.querySelectorAll(".card").forEach(b=>b.onclick=()=>{q++;m.querySelectorAll(".card").forEach(x=>x.classList.remove("play"));b.classList.add("play");say(items[b.dataset.i][1],()=>b.classList.remove("play"))});
  $("pa").onclick=()=>playAll();
  m.querySelectorAll("[data-d]").forEach(k=>{try{k.checked=localStorage.getItem("d"+k.dataset.d)=="1"}catch(_){}k.onchange=()=>{try{localStorage.setItem("d"+k.dataset.d,k.checked?1:0)}catch(_){}}});
  const np=$("np");if(np){try{np.value=localStorage.getItem("np")||""}catch(_){}np.oninput=()=>{try{localStorage.setItem("np",np.value)}catch(_){}}}
}
S.forEach((s,i)=>{const b=document.createElement("button");b.innerHTML=`<span>${s[0]}</span>${s[2]}`;b.onclick=()=>{cur=i;render()};nav.append(b)});
$("n").onclick=()=>{slow=false;$("n").classList.add("on");$("s").classList.remove("on")};
$("s").onclick=()=>{slow=true;$("s").classList.add("on");$("n").classList.remove("on")};
render();
</script>
